# Release: builds the Nawa desktop app (apps/desktop, electron-builder.yml) on macOS, Windows
# and Linux and attaches the installers to the GitHub Release for the pushed tag.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the version: `vX.Y.Z` (or `vX.Y.Z-beta.1`, published as a pre-release) is stamped
# into the packaged app, so apps/desktop/package.json does not need a bump per release.
#
# Flow: `draft` creates a draft release with generated notes, each `build` job uploads its
# platform's installers into that draft (electron-builder `releaseType: draft` finds it by tag),
# and `publish` makes the release public only once every platform succeeded. A failed platform
# therefore leaves a draft to fix or delete, never a public release with missing downloads.
#
# Run it by hand (workflow_dispatch) for a dry run: it packages every platform without
# publishing and keeps the installers as workflow artifacts for 7 days.
#
# Builds are not signed with a paid certificate (macOS is ad-hoc signed, Windows and Linux are
# unsigned), so no signing secrets are needed; GITHUB_TOKEN is enough to publish.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Create draft release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ -n "${BASH_REMATCH[2]}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Create the draft (kept if it already exists, e.g. on a re-run)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; the builds upload into it."
            exit 0
          fi
          flags=(--draft --verify-tag --generate-notes --title "Nawa $VERSION")
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"

  build:
    name: Package (${{ matrix.os }})
    needs: draft
    # Tag pushes wait for the draft; manual dry runs skip it and still build.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || github.ref_type != 'tag') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Same as ci.yml; satisfies package.json engines (>=22.15.0).
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          # electron-builder downloads the Electron build for each target itself.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build the desktop app and its workspace dependencies
        run: pnpm turbo run build --filter=@studio/desktop...
      - name: Package and publish to the draft release
        if: github.ref_type == 'tag'
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: pnpm exec electron-builder --publish always "-c.extraMetadata.version=$VERSION"
      - name: Package (dry run, not published)
        if: github.ref_type != 'tag'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --publish never
      - name: Keep the installers as workflow artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: nawa-${{ runner.os }}
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*.exe
            apps/desktop/out/*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [draft, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.draft.outputs.prerelease }}
        run: |
          latest=$([[ "$PRERELEASE" == true ]] && echo false || echo true)
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
