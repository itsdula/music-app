name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, boundaries, unit/integration tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          # This job does not launch Electron; skip the ~100 MB binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Codegen
        run: pnpm codegen
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Package boundaries
        run: pnpm boundaries
      - name: Unit, react, integration and contract tests (with coverage)
        run: pnpm test:coverage
      - name: Browser tests (real Chromium Web Audio)
        run: pnpm test:browser
      - name: Build
        run: pnpm build
      - name: End-to-end tests
        run: pnpm test:e2e:only
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
