name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, boundaries, unit/integration tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          # This job does not launch Electron; skip the ~100 MB binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Codegen
        run: pnpm codegen
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Package boundaries
        run: pnpm boundaries
      - name: Sample projects (validate every song spec)
        run: pnpm samples -- --check
      - name: Unit, react, integration and contract tests (with coverage)
        run: pnpm test:coverage
      - name: Browser tests (real Chromium Web Audio)
        run: pnpm test:browser
      - name: Build
        run: pnpm build
      - name: End-to-end tests
        run: pnpm test:e2e:only
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  electron:
    name: Electron host (unit tests + headless smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile, with the Electron binary)
        run: pnpm install --frozen-lockfile
      - name: Xvfb and Chromium sandbox prerequisites
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Codegen
        run: pnpm codegen
      - name: Host unit tests
        run: pnpm --filter @studio/electron-host test
      - name: Smoke test (real Electron under Xvfb; probe page, then the full Studio)
        run: |
          pnpm --filter @studio/electron-host smoke:probe
          pnpm --filter @studio/electron-host smoke
